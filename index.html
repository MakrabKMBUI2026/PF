<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keluh Kesah</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1b18;--mut:#6b665e;--line:#e3dfd6;--acc:#2f6f5e;--accin:#fff;--warn:#b4541a;--ok:#2f6f5e;--chip:#ece8de}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#151513;--card:#1f1e1b;--ink:#f0ede6;--mut:#a09b91;--line:#33312c;--acc:#6fbfa8;--accin:#10231d;--warn:#e8925a;--ok:#6fbfa8;--chip:#2a2824}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0)}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 18px;font-size:.95rem}
nav{display:flex;gap:6px;margin-bottom:16px}
nav button{flex:1;padding:10px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-size:.92rem;cursor:pointer}
nav button.on{background:var(--acc);color:var(--accin);border-color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
select,textarea,input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:130px;resize:vertical}
.btn{margin-top:14px;padding:11px 18px;border:0;border-radius:10px;background:var(--acc);color:var(--accin);font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink)}.btn:disabled{opacity:.5}
.note{font-size:.84rem;color:var(--mut);background:var(--chip);border-radius:10px;padding:10px 12px;margin-top:12px}
.code{font:700 1.6rem ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--acc);margin:6px 0}
.chip{display:inline-block;font-size:.75rem;padding:2px 9px;border-radius:99px;background:var(--chip);margin-right:6px}
.chip.u{color:var(--warn)}.chip.s{color:var(--ok)}
.meta{font-size:.8rem;color:var(--mut);margin-bottom:6px}
.fb{border-left:3px solid var(--acc);padding:6px 12px;margin-top:10px;background:var(--chip);border-radius:0 8px 8px 0;white-space:pre-wrap}
.txt{white-space:pre-wrap;margin:6px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row select{flex:1;min-width:130px}
.sec{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));background:none;border:0;color:var(--mut);font-size:.9rem;padding:10px;opacity:.22;cursor:pointer}.sec:hover,.sec.on{opacity:.8}
.hide{display:none}.err{color:var(--warn);font-size:.9rem;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>Suara Divisi</h1>
<p class="sub">Bilang aja guys, gk ke track kok siapa yang kirim</p>
<nav><button id="t-lapor" class="on">Lapor</button><button id="t-cek">Cek Feedback</button></nav>
<button id="t-inbox" class="sec" aria-label="Area ketua" title="Area ketua">🔒</button>

<section id="v-lapor">
 <div class="card">
  <label for="txt">Tulis keluh kesah kalian</label>
  <textarea id="txt" placeholder="semangat!"></textarea>
  <button class="btn" id="send">Kirim anonim</button>
  <div class="err" id="err"></div>
  <div class="note">Gk keshow kok siapa yang kirim, aman guys</div>
 </div>
 <div class="card hide" id="done"><b>Laporan terkirim.</b><div class="code" id="code"></div><div class="meta">Simpan kode ini. Hanya kode ini yang bisa membuka balasan ketua.</div></div>
</section>

<section id="v-cek" class="hide">
 <div class="card">
  <label for="ck">Masukkan kode laporan</label>
  <input id="ck" placeholder="LP-XXXXXXXX" autocapitalize="characters">
  <button class="btn" id="ckb">Lihat feedback</button><div id="ckr"></div>
 </div>
</section>

<section id="v-inbox" class="hide">
 <div class="card" id="login">
  <label for="em">Email ketua</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" id="li">Masuk</button><div class="err" id="lerr"></div>
 </div>
 <div id="panel" class="hide">
  <div class="row" style="margin-bottom:12px">
   <select id="fs"><option value="">Semua status</option><option>Baru</option><option>Diproses</option><option>Selesai</option></select>
   <button class="btn ghost" id="rf" style="margin:0">Muat ulang</button>
   <button class="btn ghost" id="lo" style="margin:0">Keluar</button>
  </div>
  <div id="list"></div>
 </div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== ISI DUA BARIS INI (Supabase > Project Settings > API) =====
const SUPABASE_URL="https://baofhbijbvqfhpgmakvv.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_lphDHIzEC96ohV7aXCBZlQ_sp8UBQpz";
// =================================================================
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>t?new Date(t).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true}});
let reports=[],fbs={};

function show(t){["lapor","cek","inbox"].forEach(k=>{$("v-"+k).classList.toggle("hide",k!==t);$("t-"+k).classList.toggle("on",k===t);});}
["lapor","cek","inbox"].forEach(k=>$("t-"+k).onclick=()=>show(k));
function newCode(){const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789",r=crypto.getRandomValues(new Uint8Array(8));return "LP-"+Array.from(r,x=>a[x%a.length]).join("");}

$("send").onclick=async()=>{
 $("err").textContent="";
 const text=$("txt").value.trim();
 if(text.length<10){$("err").textContent="Ceritakan sedikit lebih detail ya.";return;}
 $("send").disabled=true;
 const code=newCode();
 const {error}=await sb.from("reports").insert({code,text});
 if(error){console.error(error);$("err").textContent="Gagal mengirim. Detail: "+(error.message||"")+(error.code?" (kode "+error.code+")":"");}
 else{$("code").textContent=code;$("done").classList.remove("hide");$("txt").value="";}
 $("send").disabled=false;
};

$("ckb").onclick=async()=>{
 const code=$("ck").value.trim().toUpperCase(),o=$("ckr");
 if(!code)return;
 const {data,error}=await sb.rpc("get_feedback",{p_code:code});
 if(error){o.innerHTML='<div class="note">Tidak bisa membaca data saat ini.</div>';return;}
 if(data&&data.length){const d=data[0];o.innerHTML=`<div class="meta" style="margin-top:12px">Status: <span class="chip s">${esc(d.status)}</span> ${fmt(d.updated_at)}</div><div class="fb">${esc(d.text||"(belum ada pesan)")}</div>`;}
 else o.innerHTML='<div class="note">Belum ada balasan untuk kode ini. Cek lagi nanti.</div>';
};

async function load(){
 const [r,f]=await Promise.all([sb.from("reports").select("*").order("created_at",{ascending:false}),sb.from("feedback").select("*")]);
 reports=r.data||[];fbs={};(f.data||[]).forEach(x=>fbs[x.code]=x);render();
}
function render(){
 const f2=$("fs").value;
 const rows=reports.filter(r=>{const st=(fbs[r.code]||{}).status||"Baru";return !f2||st===f2;});
 $("list").innerHTML=rows.length?rows.map(r=>{
  const f=fbs[r.code]||{},st=f.status||"Baru";
  return `<div class="card" data-code="${esc(r.code)}">
   <div class="meta"><span class="chip ${st==="Selesai"?"s":""}">${st}</span> ${fmt(r.created_at)} · ${esc(r.code)}</div>
   <div class="txt">${esc(r.text)}</div>
   <label>Feedback untuk pelapor</label>
   <textarea class="rp" style="min-height:70px">${esc(f.text||"")}</textarea>
   <div class="row" style="margin-top:8px"><select class="st"><option${st==="Baru"?" selected":""}>Baru</option><option${st==="Diproses"?" selected":""}>Diproses</option><option${st==="Selesai"?" selected":""}>Selesai</option></select><button class="btn sv" style="margin:0">Simpan</button></div>
  </div>`;}).join(""):'<div class="note">Belum ada laporan.</div>';
}
$("fs").onchange=render;$("rf").onclick=load;
$("list").onclick=async e=>{
 if(!e.target.classList.contains("sv"))return;
 const c=e.target.closest(".card"),code=c.dataset.code;e.target.disabled=true;
 const {error}=await sb.from("feedback").upsert({code,text:c.querySelector(".rp").value.trim(),status:c.querySelector(".st").value,updated_at:new Date().toISOString()});
 if(error)alert("Gagal menyimpan.");else await load();
 e.target.disabled=false;
};

function gate(session){$("login").classList.toggle("hide",!!session);$("panel").classList.toggle("hide",!session);if(session)load();}
$("li").onclick=async()=>{
 $("lerr").textContent="";
 const {data,error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
 if(error)$("lerr").textContent="Email atau password salah.";else gate(data.session);
};
$("lo").onclick=async()=>{await sb.auth.signOut();reports=[];fbs={};gate(null);};
sb.auth.getSession().then(({data})=>gate(data.session));
</script>
</body>
</html>
